[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Learning content recommender: implicit ALS, learning-aware re-ranking, offline and simulated online evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pytest-cov>=5", "mypy>=1.10", "pre-commit>=3.7", "matplotlib>=3.8"]

[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=recsys --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["recsys"]
# The optional two-tower model needs the [deep] extra (torch), which CI does not install.
omit = ["*/recsys/two_tower.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
